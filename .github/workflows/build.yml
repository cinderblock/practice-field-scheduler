name: Build image

# Push to master → check, test, build the image, push it to GHCR. That is the
# whole job: this repo publishes a *candidate*, it does not deploy.
#
# What runs on steamboat is decided in the ops repo (cinderblock/ops) by
# servers/steamboat/stacks/practice-field-scheduler/pin.json, which names an
# image digest. Shipping a build therefore takes two steps:
#
#   1. push here → CI publishes ghcr.io/cinderblock/practice-field-scheduler:<sha>
#   2. edit that pin.json in ops to the image's digest, commit, push
#
# This repo has no self-hosted runner and no access to steamboat. It used to:
# `deploy.yml` ran on a runner registered to this repo and restarted the live
# service on the box. See ops plans/ops-owned-app-deploys.md.
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # cinderblock/practice-field-scheduler

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Gate quality before shipping. The full test workflow runs in parallel;
      # these are the fast checks that should never publish a broken image.
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:unit

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Pin-able sha tag for reproducible deploys + a moving latest.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          # ops verifies this label against the commit its pin claims, so a
          # hand-edited pin.json can't quietly ship a different build than the
          # one that was reviewed. Required — the deploy fails without it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize how to deploy this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "Paste that into \`servers/steamboat/stacks/practice-field-scheduler/pin.json\`"
            echo "in cinderblock/ops and push. Nothing reaches steamboat until you do."
          } >> "$GITHUB_STEP_SUMMARY"
