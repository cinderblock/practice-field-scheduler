name: Test

# This repo is public. `pull_request`, not `pull_request_target`: the job checks
# out the contributor's code and runs `npm ci` and their tests, so it must not
# hold anything worth stealing. On `pull_request` a fork's run gets no secrets
# and a read-only token; the old `pull_request_target` gave that same untrusted
# code the repo's secrets and a write-scoped token. (No fork ever triggered it,
# so nothing was exposed — but any fork PR could have.)
on:
  push:
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      DATA_DIR: .tmp/ci-data
      TEST_AUTH_BYPASS: "1"
      ENABLE_SOURCEMAPS: "true"

    steps:
      # No `ref:` — `pull_request` checks out the merge commit, which is what
      # should be tested. Naming head.sha here is only needed (and only safe)
      # with pull_request_target, which this deliberately isn't.
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit test
        id: unit
        run: npm run test:unit
        env:
          FIRST_API_USERNAME: ${{ vars.FIRST_API_USERNAME }}
          FIRST_API_AUTH_TOKEN: ${{ secrets.FIRST_API_AUTH_TOKEN }}

      - name: Run e2e test
        if: success() || steps.unit.conclusion == 'failure'
        id: e2e
        run: npm run test:e2e
        env:
          FIRST_API_USERNAME: ${{ vars.FIRST_API_USERNAME }}
          FIRST_API_AUTH_TOKEN: ${{ secrets.FIRST_API_AUTH_TOKEN }}

      - name: Upload test artifacts (allure results)
        if: success() || steps.unit.conclusion == 'failure' || steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            allure-results
          retention-days: 7
          if-no-files-found: ignore

  # Pushes only. This job needs write access to publish to gh-pages, so it must
  # never run in the same workflow as a fork's code; a PR from a fork still gets
  # the allure-results artifact from the job above.
  publish-test-report:
    if: ${{ always() && github.event_name == 'push' }}
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: publish-test-report
      cancel-in-progress: false

    steps:
      - name: Load test report history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download test artifacts (allure results)
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: .

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.15
        with:
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run check

      - name: Run typecheck
        run: npm run typecheck
